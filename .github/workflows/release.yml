name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri App & Bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Smart Island ${{ github.ref_name }}'
          releaseBody: |
            ### 🏝️ Smart Island for Windows ${{ github.ref_name }}

            #### ✨ Что нового:
            - **Dynamic Island**: эстетичный оверлей с физикой Framer Motion 60 FPS, боковыми ушками (concave ears), каруселью плеера/Docker/VPN и автосворачиванием.
            - **Dual-Engine VPN**: гибридная связка **Xray-core v26.10.31** + **sing-box v1.14** с полной поддержкой VLESS Reality (Post-Quantum ML-KEM/Kyber), VMess, Trojan, Shadowsocks 2022, Hysteria 2, TUIC.
            - **Защита от петель маршрутизации**: прямой доступ к IP сервера (админ-панели 3X-UI) и локальным подсетям.
            - **Плеер & Аудиомикшер**: интеграция с Windows GSMTC и переключение дефолтных устройств вывода/ввода.
            - **Docker Manager**: управление локальными контейнерами в один клик.
            - **Центр уведомлений**: всплывающие превью-баннеры и синхронизация с Action Center.

            #### 📦 Установочные файлы:
            - **`.exe` (NSIS Setup)**: классический установщик с мастером установки.
            - **`.msi` (Windows Installer)**: системный установочный пакет.
          releaseDraft: false
          prerelease: false
